# Include inside the GAME site's server {} block, after setting up its certificate.
# Replace an existing location / instead of adding a duplicate.
# Remove generic js/css/image cache locations that would bypass this proxy.
# Keep Baota's certificate and /.well-known/ validation configuration.
location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 8m;
}
